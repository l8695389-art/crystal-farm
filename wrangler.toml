name = "crystal-farm"
main = "src/worker.js"
compatibility_date = "2024-09-23"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "crystal_tap_db"
database_id = "614f96af-be19-4f99-85d9-3e2b2ee48c8e"

[vars]
# URL của chính Worker này (sau khi deploy), dùng để gắn nút "Chơi ngay"
# trong tin nhắn trả lời /start. Ví dụ: https://crystal-tap-game.<subdomain>.workers.dev
MINI_APP_URL = "https://crystal-farm.pagesm.workers.dev"

# Optional: set your Telegram bot token as a secret to validate initData
# và để bot có thể gửi tin nhắn trả lời /start
# wrangler secret put BOT_TOKEN

# Optional: đặt secret token cho webhook để xác minh request thực sự từ Telegram
# wrangler secret put WEBHOOK_SECRET

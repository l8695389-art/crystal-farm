<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Đào Đá Quý</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --bg: #0B0B14;
    --surface: #14152A;
    --surface-2: #1D1E3A;
    --border: #22203f;
    --crystal: #7C5CFC;
    --crystal-glow: #A78BFA;
    --cyan: #3ED8C3;
    --gold: #F5B942;
    --text: #EDEBFF;
    --text-dim: #8B87B0;
    --text-faint: #6B6790;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); font-family: 'Inter', sans-serif; }
  #app-shell {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .phone {
    width: 380px;
    max-width: 100%;
    background: linear-gradient(180deg,#12132A 0%,#0B0B14 100%);
    border-radius: 28px;
    border: 1px solid var(--border);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 640px;
    position: relative;
  }
  .hidden { display: none !important; }

  /* welcome */
  .welcome-card {
    width: 320px;
    max-width: 100%;
    margin: 40px auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 36px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 6px;
  }
  .welcome-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; color: var(--text); margin-top: 10px; }
  .welcome-sub { color: var(--text-dim); font-size: 13px; margin-bottom: 14px; }
  .text-input {
    width: 100%; background: var(--bg); border: 1px solid #2C2C52; border-radius: 10px;
    padding: 10px 14px; color: var(--text); font-size: 14px; margin-bottom: 14px; outline: none;
  }
  .primary-btn {
    width: 100%; background: linear-gradient(135deg,var(--crystal),var(--cyan)); border: none;
    color: var(--bg); font-weight: 700; font-size: 14px; padding: 12px 0; border-radius: 12px; cursor: pointer;
  }

  /* header */
  .header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 12px; }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 36px; height: 36px; border-radius: 10px; overflow: hidden;
    background: linear-gradient(135deg,var(--crystal),var(--cyan));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--bg);
    flex-shrink: 0;
  }
  .lb-avatar-fallback {
    width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
    background: linear-gradient(135deg,var(--crystal),var(--cyan));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 12px; color: var(--bg);
  }
  .nick-text { color: var(--text); font-weight: 600; font-size: 14px; }
  .sub-text { color: var(--text-dim); font-size: 11px; margin-top: 2px; }
  .coin-pill {
    display: flex; align-items: center; gap: 6px; background: var(--surface-2);
    padding: 6px 12px; border-radius: 999px; border: 1px solid #2C2C52;
  }
  .coin-text { font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--gold); font-size: 14px; }

  .toast {
    position: absolute; top: 64px; left: 50%; transform: translateX(-50%);
    background: var(--surface-2); border: 1px solid #4B3FA0; color: var(--text);
    font-size: 12px; font-weight: 600; padding: 8px 16px; border-radius: 999px;
    z-index: 10; white-space: nowrap; opacity: 0; transition: opacity 200ms ease;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* play */
  .play-area { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 20px 20px; }
  .crystal-wrap {
    position: relative; width: 220px; height: 220px; display: flex; align-items: center; justify-content: center;
    margin-top: 20px; cursor: pointer; user-select: none;
  }
  .glow {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle, var(--crystal) 0%, rgba(124,92,252,0) 70%);
    opacity: .45; transition: opacity 120ms ease;
  }
  .glow.pulse { opacity: .9; }
  .crystal-btn {
    position: relative; width: 176px; height: 176px; border-radius: 50%;
    background: linear-gradient(160deg,#3A2E7A,#181A38); border: 1px solid #4B3FA0;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 40px rgba(124,92,252,0.35), inset 0 0 30px rgba(0,0,0,0.4);
    transition: transform 100ms ease;
  }
  .crystal-btn.pulse { transform: scale(0.94); }
  .crystal-btn svg { width: 96px; height: 96px; }
  .particle {
    position: absolute; color: var(--gold); font-family: 'Space Grotesk', sans-serif;
    font-weight: 700; font-size: 16px; pointer-events: none; animation: floatUp 700ms ease-out forwards;
  }
  @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-50px); } }
  .tap-hint { color: var(--text-faint); font-size: 12px; margin-top: 14px; }
  .energy-row { display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 26px; }
  .energy-track { flex: 1; height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .energy-fill { height: 100%; background: linear-gradient(90deg,var(--cyan),var(--crystal)); transition: width 300ms ease; }
  .energy-text { color: var(--text-dim); font-size: 11px; font-family: 'Space Grotesk', sans-serif; min-width: 62px; text-align: right; }
  .checkin-btn {
    margin-top: 18px; display: flex; align-items: center; gap: 8px; background: var(--surface-2);
    border: 1px solid #2C2C52; color: var(--text); padding: 10px 18px; border-radius: 12px;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .checkin-btn:disabled { opacity: .5; cursor: default; }

  /* lists */
  .list-area { flex: 1; padding: 8px 18px 16px; overflow-y: auto; }
  .section-title { display: flex; align-items: center; gap: 8px; color: var(--text); font-weight: 600; font-size: 14px; margin: 8px 0 14px; }
  .lb-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; }
  .lb-rank { color: var(--text-faint); font-family: 'Space Grotesk', sans-serif; font-weight: 700; width: 20px; }
  .lb-name { flex: 1; color: var(--text); font-size: 13px; font-weight: 500; }
  .lb-coins { color: var(--gold); font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 13px; }
  .footnote { color: var(--text-faint); font-size: 11px; margin-top: 10px; text-align: center; }
  .mission-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; }
  .mission-label { color: var(--text); font-size: 13px; font-weight: 500; }
  .claim-btn { background: linear-gradient(135deg,var(--crystal),var(--cyan)); border: none; color: var(--bg); font-weight: 700; font-size: 12px; padding: 6px 14px; border-radius: 999px; cursor: pointer; }
  .claim-btn:disabled { opacity: .4; cursor: default; }

  /* nav */
  .nav { display: flex; border-top: 1px solid var(--surface-2); padding: 8px 4px; background: #0F1024; }
  .nav-btn { flex: 1; background: transparent; border: none; display: flex; flex-direction: column; align-items: center; padding: 6px 0; cursor: pointer; color: var(--text-faint); }
  .nav-btn.active { color: var(--crystal-glow); }
  .nav-btn span { font-size: 11px; margin-top: 2px; }
  .loading {
    color: var(--text-dim); text-align: center; padding: 40px;
  }
  .loading-screen {
    width: 320px; max-width: 100%; margin: 100px auto 0;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .loading-title {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px;
    color: var(--text); margin: 14px 0 22px; letter-spacing: 0.3px;
  }
  .loading-bar-track {
    width: 100%; height: 8px; background: var(--surface-2); border-radius: 999px;
    overflow: hidden; border: 1px solid var(--border);
  }
  .loading-bar-fill {
    height: 100%; width: 0%; border-radius: 999px;
    background: linear-gradient(90deg, var(--crystal), var(--cyan));
    box-shadow: 0 0 10px rgba(124,92,252,0.6);
    transition: width 200ms ease;
  }
  .loading-pct {
    margin-top: 10px; font-family: 'Space Grotesk', sans-serif; font-size: 12px;
    color: var(--text-faint); letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div id="app-shell">
  <div class="loading-screen" id="loading">
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#A78BFA" stroke-width="1.4" style="filter:drop-shadow(0 0 16px #7C5CFC)"><path d="M6 3h12l4 6-10 12L2 9Z"/><path d="M11 3 8 9l4 12 4-12-3-6"/><path d="M2 9h20"/></svg>
    <div class="loading-title">Đào Đá Quý</div>
    <div class="loading-bar-track">
      <div class="loading-bar-fill" id="loading-bar-fill"></div>
    </div>
    <div class="loading-pct" id="loading-pct">0%</div>
  </div>

  <div class="welcome-card hidden" id="blocked">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#F5B942" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>
    <div class="welcome-title">Chỉ mở được trong Telegram</div>
    <div class="welcome-sub">Đào Đá Quý là Telegram Mini App. Vui lòng mở trò chơi từ bot Telegram thay vì trình duyệt.</div>
  </div>

  <div class="welcome-card hidden" id="welcome">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#A78BFA" stroke-width="1.5" style="filter:drop-shadow(0 0 14px #7C5CFC)"><path d="M6 3h12l4 6-10 12L2 9Z"/><path d="M11 3 8 9l4 12 4-12-3-6"/><path d="M2 9h20"/></svg>
    <div class="welcome-title">Đào Đá Quý</div>
    <div class="welcome-sub">Chạm để đào, tích xu, leo bảng xếp hạng.</div>
    <input class="text-input" id="nickname-input" placeholder="Đặt biệt danh của bạn" maxlength="16" />
    <button class="primary-btn" id="start-btn">Bắt đầu chơi</button>
  </div>

  <div class="phone hidden" id="phone">
    <div class="header">
      <div class="header-left">
        <div class="avatar" id="avatar-letter"></div>
        <div>
          <div class="nick-text" id="nick-text"></div>
          <div class="sub-text" id="taps-text"></div>
        </div>
      </div>
      <div class="coin-pill">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F5B942" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 7v10M9 9.5c0-1 1-1.5 3-1.5s3 1 3 2-1 1.5-3 1.5-3 .5-3 1.5 1 2 3 2 3-.5 3-1.5"/></svg>
        <span class="coin-text" id="coin-text">0</span>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <div class="play-area" id="tab-play">
      <div class="crystal-wrap" id="crystal-wrap">
        <div class="glow" id="glow"></div>
        <div class="crystal-btn" id="crystal-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="#EDEBFF" stroke-width="1.3"><path d="M6 3h12l4 6-10 12L2 9Z"/><path d="M11 3 8 9l4 12 4-12-3-6"/><path d="M2 9h20"/></svg>
        </div>
      </div>
      <div class="tap-hint">Chạm viên đá để đào xu</div>
      <div class="energy-row">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3ED8C3" stroke-width="2"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></svg>
        <div class="energy-track"><div class="energy-fill" id="energy-fill" style="width:100%"></div></div>
        <span class="energy-text" id="energy-text">500/500</span>
      </div>
      <button class="checkin-btn" id="checkin-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F5B942" stroke-width="2"><path d="M12 2c1 3-2 4-2 7a4 4 0 0 0 8 0c0-1-.5-2-1-2 1 4-1 5-1 5"/></svg>
        <span id="checkin-label">Điểm danh · Chuỗi 0 ngày</span>
      </button>
    </div>

    <div class="list-area hidden" id="tab-leaderboard">
      <div class="section-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F5B942" stroke-width="2"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M5 4H3v2a4 4 0 0 0 4 4M19 4h2v2a4 4 0 0 1-4 4"/></svg>
        Bảng xếp hạng
      </div>
      <div id="leaderboard-list"></div>
      <div class="footnote">Bảng xếp hạng hiển thị công khai cho mọi người chơi.</div>
    </div>

    <div class="list-area hidden" id="tab-missions">
      <div class="section-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3ED8C3" stroke-width="2"><path d="M20 12v9H4v-9M2 7h20v5H2z"/><path d="M12 22V7M12 7c-1.5-3-5.5-3-5.5 0S10.5 7 12 7Zm0 0c1.5-3 5.5-3 5.5 0S13.5 7 12 7Z"/></svg>
        Nhiệm vụ
      </div>
      <div id="missions-list"></div>
    </div>

    <div class="nav">
      <button class="nav-btn active" data-tab="play">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.9 4.3L6 9l4.1 1.7L12 15l1.9-4.3L18 9l-4.1-1.7L12 3Z"/></svg>
        <span>Đào</span>
      </button>
      <button class="nav-btn" data-tab="leaderboard">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"/></svg>
        <span>Xếp hạng</span>
      </button>
      <button class="nav-btn" data-tab="missions">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12v9H4v-9M2 7h20v5H2z"/></svg>
        <span>Nhiệm vụ</span>
      </button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
